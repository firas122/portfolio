name: build

on:
  push:
    # Both names on purpose. This repo's default is `master`, and the workflow
    # watched `main` only -- so from the rename onward every push went green by
    # never running. Listing both means a future rename cannot silently
    # switch CI off again.
    branches: [master, main]
  pull_request:

jobs:
  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
